<!doctype html>
<html lang="es-PY">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Rugby NEA Manager</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <header id="topbar">
      <div id="brand">🏉 Rugby NEA Manager</div>
      <nav id="mainNav" class="hidden">
        <button data-view="dashboard" class="navBtn">Panel</button>
        <button data-view="standings" class="navBtn">Tabla</button>
        <button data-view="fixture" class="navBtn">Fixture</button>
        <button data-view="squad" class="navBtn">Plantel</button>
      </nav>
      <div id="topbarRight" class="hidden">
        <span id="myTeamBadge"></span>
        <button id="langToggleBtn" title="Cambiar idioma / Trocar idioma">Português</button>
        <button id="newGameBtn" title="Empezar un juego nuevo">Nuevo juego</button>
      </div>
    </header>

    <main id="content"></main>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
