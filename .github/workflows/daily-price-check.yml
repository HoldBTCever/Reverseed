name: daily-price-check

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: rugby-boots-price-monitor
        run: pip install -r requirements.txt

      - name: Run scraper
        working-directory: rugby-boots-price-monitor
        run: python -m scraper.scrape

      - name: Aggregate + build alerts
        working-directory: rugby-boots-price-monitor
        run: python -m scraper.aggregate

      - name: Commit updated price data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add rugby-boots-price-monitor/data rugby-boots-price-monitor/site/data
          if git diff --cached --quiet; then
            echo "Sem mudanças de preço hoje."
          else
            git commit -m "chore: atualiza preços de chuteiras de rugby ($(date -u +%F))"
            git push
          fi

  deploy:
    needs: scrape
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload dashboard artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: rugby-boots-price-monitor/site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
